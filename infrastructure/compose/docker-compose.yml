name: openwrt-ai-studio

x-php-env: &php-env
  APP_NAME: OpenWrt AI Studio
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: "${APP_DEBUG:-true}"
  APP_URL: ${APP_URL:-http://127.0.0.1:8080}
  APP_KEY: ${APP_KEY:?Set APP_KEY — run ./scripts/bootstrap.sh}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB}
  DB_USERNAME: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  WORKSPACE_ROOT: /data/workspaces
  STUDIO_HOST_ROOT: ${STUDIO_HOST_ROOT:?Set STUDIO_HOST_ROOT — run ./scripts/bootstrap.sh}
  SANDBOX_HOST_WORKSPACE_ROOT: ${DATA_ROOT:?Set DATA_ROOT — run ./scripts/bootstrap.sh}/workspaces
  OPENWRT_CACHE_ROOT: /data/openwrt
  OPENWRT_DL_ROOT: /data/downloads-cache
  OPENWRT_CCACHE_ROOT: /data/ccache
  OPENWRT_HOST_CACHE_ROOT: ${DATA_ROOT}/openwrt
  OPENWRT_HOST_DL_ROOT: ${DATA_ROOT}/downloads-cache
  OPENWRT_HOST_CCACHE_ROOT: ${DATA_ROOT}/ccache
  AI_GATEWAY_URL: ${AI_GATEWAY_URL}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
  AI_GATEWAY_MODEL: ${AI_GATEWAY_MODEL:-}
  AI_TOOL_MODE: ${AI_TOOL_MODE:-auto}
  AGENT_TYPE: studio
  SANDBOX_DRIVER: docker
  SANDBOX_IMAGE: openwrt-ai-agent:latest
  OPENHANDS_URL: ${OPENHANDS_URL:-}
  OPENHANDS_SESSION_KEY: ${OPENHANDS_SESSION_KEY:-}
  BUILD_DRIVER: ${BUILD_DRIVER:-docker}
  BUILD_BUILDROOT_IMAGE: ${BUILD_BUILDROOT_IMAGE:-openwrt-ai-buildroot:24.10}
  BUILD_CPUS: "${BUILD_CPUS:-2}"
  BUILD_MEMORY: ${BUILD_MEMORY:-1g}
  BUILD_FIRMWARE_CPUS: "${BUILD_FIRMWARE_CPUS:-4}"
  BUILD_FIRMWARE_MEMORY: ${BUILD_FIRMWARE_MEMORY:-8g}
  BUILD_FIRMWARE_TIMEOUT: "${BUILD_FIRMWARE_TIMEOUT:-7200}"
  ARTIFACT_STORE: ${ARTIFACT_STORE:-minio}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: artifacts
  QUEUE_WORKERS: "2"

x-php-build: &php-build
  context: ../..
  dockerfile: docker/api/Dockerfile

x-php-runtime: &php-runtime
  user: "1000:1000"
  group_add:
    - "${DOCKER_GID:?Set DOCKER_GID to the gid of /var/run/docker.sock}"
  env_file:
    - .env
  volumes:
    - ../../apps/api:/var/www
    - ${DATA_ROOT}/workspaces:/data/workspaces
    - ${DATA_ROOT}/openwrt:/data/openwrt
    - ${DATA_ROOT}/downloads-cache:/data/downloads-cache
    - ${DATA_ROOT}/ccache:/data/ccache
    - /var/run/docker.sock:/var/run/docker.sock
  networks:
    - studio

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_ROOT}/postgres:/var/lib/postgresql/data
    ports:
      - "${HOST_BIND:-127.0.0.1}:5432:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - studio

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - ${DATA_ROOT}/redis:/data
    ports:
      - "${HOST_BIND:-127.0.0.1}:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - studio

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${DATA_ROOT}/minio:/data
    ports:
      - "${HOST_BIND:-127.0.0.1}:9000:9000"
      - "${HOST_BIND:-127.0.0.1}:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - studio

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/artifacts
        mc mb --ignore-existing local/workspaces
        mc mb --ignore-existing local/logs
    networks:
      - studio

  api:
    <<: *php-runtime
    build: *php-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *php-env

  agent:
    build:
      context: ../..
      dockerfile: docker/agent/Dockerfile
    image: openwrt-ai-agent:latest
    profiles: ["sandbox"]
    command: ["sleep", "infinity"]
    user: "1000:1000"
    networks:
      - studio

  queue:
    <<: *php-runtime
    build: *php-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *php-env
    entrypoint: ["php", "artisan", "queue:work", "redis", "--queue=builds", "--sleep=1", "--tries=1", "--timeout=7500"]

  queue-2:
    <<: *php-runtime
    build: *php-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *php-env
    entrypoint: ["php", "artisan", "queue:work", "redis", "--queue=builds", "--sleep=1", "--tries=1", "--timeout=7500"]

  queue-agent:
    <<: *php-runtime
    build: *php-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *php-env
    entrypoint: ["php", "artisan", "queue:work", "redis", "--queue=agent", "--sleep=1", "--tries=1", "--timeout=180"]

  buildroot:
    build:
      context: ../..
      dockerfile: docker/buildroot/Dockerfile
    image: openwrt-ai-buildroot:24.10
    profiles: ["sandbox"]
    command: ["sleep", "infinity"]
    user: "1000:1000"
    networks:
      - studio

  buildroot-legacy:
    build:
      context: ../..
      dockerfile: docker/buildroot/Dockerfile.legacy
    image: openwrt-ai-buildroot:14.07
    profiles: ["sandbox"]
    command: ["sleep", "infinity"]
    user: "1000:1000"
    networks:
      - studio

  web:
    build:
      context: ../..
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    volumes:
      - ../../apps/web:/app
      - web_node_modules:/app/node_modules
    networks:
      - studio

  nginx:
    image: nginx:1.24-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - postgres
      - redis
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - studio

volumes:
  web_node_modules:

networks:
  studio:
    name: openwrt-ai-studio
